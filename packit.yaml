upstream_package_name: SwayNotificationCenter
upstream_project_url: https://github.com/ErikReider/SwayNotificationCenter
create_sync_note: false

jobs:
  - job: pull_from_upstream
    trigger: release
    dist_git_branches:
      rawhide:
        fast_forward_merge_into:
          - fedora-branched
  - job: koji_build
    trigger: commit
    dist_git_branches:
      - fedora-all
  - job: bodhi_update
    trigger: commit
    dist_git_branches:
      - fedora-branched
